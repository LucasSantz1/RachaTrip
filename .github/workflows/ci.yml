name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rachatrip-ci
          MYSQL_DATABASE: rachatrip
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prachatrip-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rachatrip-ci
      MYSQL_DATABASE: rachatrip
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: pip install -r backend/requirements-dev.txt
      - name: Gerar DJANGO_SECRET_KEY
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
      - name: Ruff
        run: ruff check backend
      - name: Migrações pendentes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Pytest
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Auditoria de dependências de runtime
        run: npm audit --omit=dev --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar .env com segredos gerados
        run: |
          cp .env.example .env
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')|" .env
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(16))')|" .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(16))')|" .env
      # No runner, o checkout pertence ao uid 1001, mas os containers rodam como uid 1000
      # (node/app) sobre bind mounts; sem isso o Next não consegue criar next-env.d.ts.
      - name: Permitir escrita nos bind mounts
        run: chmod -R a+rwX frontend backend
      - name: Subir os serviços
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health via rewrite do web (web, api e db)
        run: |
          body=$(curl --retry 10 --retry-all-errors --retry-delay 3 -fsS http://127.0.0.1:3000/api/health/) && echo "$body" && echo "$body" | grep '"status":"ok"'
      - name: Cabeçalhos de segurança do web
        run: |
          curl -fsSI http://127.0.0.1:3000/ | grep -i 'referrer-policy: no-referrer'
      - name: Migrações
        run: docker compose exec -T api python manage.py migrate --noinput
      - name: Pytest como usuário da aplicação
        run: docker compose exec -T api pytest
      - name: Logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          # Logs de Actions exigem login; anotações são públicas. Publica o fim de cada serviço.
          for svc in db api web; do
            msg=$(docker compose logs --no-color --tail 40 "$svc" 2>&1 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=logs ${svc}::${msg}"
          done
      - name: Derrubar
        if: always()
        run: docker compose down -v
